[project]
name = "linkdo-agent"
version = "0.1.0"
description = "Link-Do AI Agent — 流式对话 API，支持两阶段确认"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "A1ex", email = "alex@example.com" }]
keywords = ["link-do", "agent", "fastapi", "mcp", "sse"]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "orjson>=3.10.0",
    "structlog>=24.0.0,<25.0.0",
    "tenacity>=8.0.0",
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
linkdo-agent = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
